<!--
  Arte do anúncio do Contador Concursado.

  SVG e não imagem gerada: fica nítido em qualquer tela, pesa 3 KB
  em vez de centenas, e as cores vêm da paleta da marca. Substituir
  por uma peça definitiva é trocar este arquivo.

  A composição é vertical (3:4) porque o banner da lateral é
  estreito e alto — arte horizontal apareceria como uma faixa fina.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400"
     role="img" aria-label="Contador Concursado — CFC Academy">

  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22344A"/>
      <stop offset="1" stop-color="#141F2C"/>
    </linearGradient>

    <linearGradient id="destaque" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9FE31A"/>
      <stop offset="1" stop-color="#6FA80F"/>
    </linearGradient>
  </defs>

  <rect width="300" height="400" fill="url(#fundo)"/>

  <!-- Grade sutil ao fundo: remete a planilha sem literalidade -->
  <g stroke="#FFFFFF" stroke-opacity=".05" stroke-width="1">
    <path d="M0 90h300M0 150h300M0 210h300M0 270h300M0 330h300"/>
    <path d="M75 0v400M150 0v400M225 0v400"/>
  </g>

  <!-- Selo de aprovação, o símbolo do que o curso entrega -->
  <g transform="translate(150,112)">
    <circle r="46" fill="url(#destaque)" opacity=".14"/>
    <circle r="34" fill="none" stroke="url(#destaque)" stroke-width="2.5"/>
    <path d="M-14 2 l9 10 L19 -9"
          fill="none" stroke="#9FE31A" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="150" y="196" text-anchor="middle"
        font-family="Archivo, system-ui, sans-serif"
        font-size="15" font-weight="700" fill="#9FE31A"
        letter-spacing="3.4">CFC ACADEMY</text>

  <text x="150" y="240" text-anchor="middle"
        font-family="Archivo, system-ui, sans-serif"
        font-size="30" font-weight="800" fill="#FFFFFF">Contador</text>
  <text x="150" y="274" text-anchor="middle"
        font-family="Archivo, system-ui, sans-serif"
        font-size="30" font-weight="800" fill="#FFFFFF">Concursado</text>

  <line x1="110" y1="296" x2="190" y2="296"
        stroke="#9FE31A" stroke-width="3" stroke-linecap="round"/>

  <text x="150" y="326" text-anchor="middle"
        font-family="Sora, system-ui, sans-serif"
        font-size="13" fill="#B9C6CF">A preparação completa</text>
  <text x="150" y="346" text-anchor="middle"
        font-family="Sora, system-ui, sans-serif"
        font-size="13" fill="#B9C6CF">para a área contábil</text>
</svg>
