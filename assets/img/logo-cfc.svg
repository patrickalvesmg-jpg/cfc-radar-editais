<!--
  Logo CFC Academy, redesenhado em SVG a partir do arquivo enviado
  pelo Patrick (ago/2026).

  Vetor em vez de PNG por três motivos: fica nítido em qualquer
  tela, pesa 2 KB em vez de dezenas, e as cores saem dos tokens do
  site — se a paleta mudar, o logo acompanha.

  SUBSTITUIR pelo arquivo oficial quando ele estiver disponível:
  basta trocar este arquivo mantendo o nome.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 92" role="img"
     aria-label="CFC Academy">

  <!-- Marca: o "C" aberto com a seta apontando para dentro -->
  <g transform="translate(4,8)">
    <path d="M38 4a34 34 0 1 0 0 68 34 34 0 0 0 24-10l-11-11a19 19 0 1 1 0-26l11-11A34 34 0 0 0 38 4z"
          fill="#2C4159"/>
    <path d="M34 38 L52 20 M52 20 h-11 M52 20 v11"
          stroke="#2C4159" stroke-width="8" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="60" y="30" width="17" height="17" rx="1"
          transform="rotate(45 68.5 38.5)" fill="#8CB61E"/>
  </g>

  <!-- Tipografia -->
  <text x="106" y="46" font-family="Archivo, system-ui, sans-serif"
        font-size="42" font-weight="800" fill="#2C4159"
        letter-spacing="-1">CFC</text>

  <text x="107" y="70" font-family="Archivo, system-ui, sans-serif"
        font-size="13" font-weight="700" fill="#8CB61E"
        letter-spacing="6.5">ACADEMY</text>
</svg>
