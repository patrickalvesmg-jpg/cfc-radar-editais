name: Varredura de editais

# Roda na infraestrutura do GitHub — não depende de nenhum computador
# ligado. Publica DIRETO no site (decisão do Patrick, ago/2026): o
# objetivo é o radar se manter atualizado sozinho.
#
# Segurança disso: o filtro é conservador de propósito (três camadas,
# ver robo/config.py) e a varredura de 20/08/2026 fechou com ZERO cargo
# não-contábil e ZERO link para agregador em 124 editais. Se um dia
# começar a entrar lixo, o caminho é apertar o filtro — não voltar a
# depender de alguém aprovando PR todo dia.
on:
  schedule:
    # 09:00 UTC = 06:00 em Brasília. Os diários municipais do dia
    # anterior já estão indexados a essa hora.
    - cron: "0 9 * * *"
  workflow_dispatch:        # permite rodar na hora, pela aba Actions

permissions:
  contents: write

# Duas execuções mexendo no mesmo JSON dariam conflito.
concurrency:
  group: radar-editais
  cancel-in-progress: false

jobs:
  varrer:
    runs-on: ubuntu-latest

    # A varredura completa levou 53 MINUTOS na medição de 20/08/2026
    # (24 bancas + agregadores, com a pausa obrigatória entre
    # requisições ao mesmo host). O limite antigo era 15 min e mataria
    # o processo no meio, gravando nada. 90 dá folga para o dia em que
    # algum portal estiver lento.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Sem dependências externas: o robô usa só a biblioteca padrão,
      # então não há requirements.txt para instalar nem cadeia de
      # suprimentos para auditar.

      - name: Varrer fontes
        run: python -u robo/atualizar.py --limite 30

      # Rede de segurança ANTES de publicar. Se a varredura produzir
      # algo que viole as regras do produto, o job falha e o site fica
      # como está — melhor um dia desatualizado que um dia errado.
      - name: Conferir o que vai ao ar
        run: python -u robo/conferir.py

      - name: Publicar
        run: |
          if git diff --quiet -- data/; then
            echo "Nenhuma mudança — nada a publicar."
            exit 0
          fi

          git config user.name  "Radar Concursos Contabilidade"
          git config user.email "actions@github.com"
          git add data/
          git commit -m "chore(radar): varredura de $(date -u +%d/%m/%Y)"
          git push
          echo "Publicado."
