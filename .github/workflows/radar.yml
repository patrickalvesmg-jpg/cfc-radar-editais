name: Varredura de editais

# Roda na infraestrutura do GitHub — não depende de nenhum computador ligado.
on:
  schedule:
    # 09:00 UTC = 06:00 em Brasília. Os diários municipais do dia
    # anterior já estão indexados a essa hora.
    - cron: "0 9 * * *"
  workflow_dispatch:        # permite rodar manualmente pela aba Actions

permissions:
  contents: write
  pull-requests: write

# Duas execuções mexendo no mesmo JSON dariam conflito de merge.
concurrency:
  group: radar-editais
  cancel-in-progress: false

jobs:
  varrer:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Sem dependências externas: o robô usa só a biblioteca padrão,
      # então não há requirements.txt para instalar nem cadeia de
      # suprimentos para auditar.

      - name: Varrer fontes
        run: python robo/atualizar.py --limite 30

      - name: Verificar se houve mudança
        id: diff
        run: |
          if git diff --quiet -- data/editais.json; then
            echo "mudou=false" >> "$GITHUB_OUTPUT"
            echo "Nenhum edital novo hoje."
          else
            echo "mudou=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- data/editais.json
          fi

      # Pull Request em vez de commit direto: nada vai ao ar sem
      # revisão humana. Data de inscrição errada prejudica candidato
      # de verdade, e a extração automática erra.
      #
      # PRÉ-REQUISITO: em Settings → Actions → General → Workflow
      # permissions, marcar "Allow GitHub Actions to create and approve
      # pull requests". É desligado por padrão e só o dono da conta
      # consegue ativar — sem isso, este passo falha com
      # "GitHub Actions is not permitted to create or approve pull requests".
      - name: Abrir Pull Request
        id: pr
        if: steps.diff.outputs.mudou == 'true'
        continue-on-error: true
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(radar): editais capturados em ${{ github.run_id }}"
          branch: radar/varredura-automatica
          delete-branch: true
          title: "Radar: novos editais para revisão"
          body: |
            Varredura automática do Radar de Editais.

            **Antes de aprovar, confira nos itens marcados `"revisado": false`:**

            - [ ] É mesmo concurso da área contábil (não licitação ou nomeação)
            - [ ] Datas de inscrição conferem com o edital oficial
            - [ ] Salário é a remuneração do cargo (não taxa nem valor de contrato)
            - [ ] Órgão e cargo estão legíveis para quem vai ler o site

            Ao revisar um item, marque `"revisado": true` — o robô passa a
            respeitar os campos curados e não sobrescreve mais a correção.

            O campo `_trecho` traz o texto de origem, para conferir sem
            abrir o diário oficial.

            Itens com `"confianca": "baixa"` são os que mais erram.
          labels: |
            radar
            revisar

      # Se o PR não pôde ser criado, o trabalho da varredura não pode se
      # perder: guardamos o JSON como artefato e numa branch, para você
      # abrir o PR à mão ou baixar o resultado.
      - name: Guardar resultado (PR falhou)
        if: steps.diff.outputs.mudou == 'true' && steps.pr.outcome == 'failure'
        run: |
          echo "::warning::Não foi possível abrir o Pull Request."
          echo "::warning::Ative em Settings > Actions > General > Workflow permissions:"
          echo "::warning::'Allow GitHub Actions to create and approve pull requests'."
          BRANCH="radar/varredura-$(date +%Y-%m-%d)"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/editais.json
          git commit -m "chore(radar): editais capturados em ${{ github.run_id }}"
          git push -f origin "$BRANCH"
          echo "::notice::Resultado salvo na branch $BRANCH — abra o PR manualmente."

      - name: Publicar JSON como artefato
        if: steps.diff.outputs.mudou == 'true' && steps.pr.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: editais-capturados
          path: data/editais.json
          retention-days: 30
