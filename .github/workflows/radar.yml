name: Varredura de editais

# Roda na infraestrutura do GitHub — não depende de nenhum computador
# ligado. Publica DIRETO no site (decisão do Patrick, ago/2026): o
# objetivo é o radar se manter atualizado sozinho.
#
# Segurança disso: o filtro é conservador de propósito (três camadas,
# ver robo/config.py) e a varredura de 20/08/2026 fechou com ZERO cargo
# não-contábil e ZERO link para agregador em 124 editais. Se um dia
# começar a entrar lixo, o caminho é apertar o filtro — não voltar a
# depender de alguém aprovando PR todo dia.
on:
  schedule:
    # SEMANAL, segunda-feira às 08:47 UTC (05:47 em Brasília).
    #
    # Era diário. Concurso para contador não abre todo dia — a varredura
    # de 21/08 encontrou 110 contábeis, praticamente os mesmos da
    # véspera. Rodar toda madrugada consumia ~50 min de servidor para
    # reconfirmar o que já estava publicado.
    #
    # Segunda-feira porque edital costuma ser publicado em dia útil, e
    # assim a semana começa com o acervo em dia.
    #
    # 08:47 e não 09:00 de propósito: todo mundo agenda na hora cheia, e
    # o GitHub enfileira execuções quando há pico. Minuto quebrado pega
    # a fila vazia.
    - cron: "47 8 * * 1"
  workflow_dispatch:        # permite rodar na hora, pela aba Actions

permissions:
  contents: write

# Duas execuções mexendo no mesmo JSON dariam conflito.
concurrency:
  group: radar-editais
  cancel-in-progress: false

jobs:
  varrer:
    runs-on: ubuntu-latest

    # A varredura completa levou 53 MINUTOS na medição de 20/08/2026
    # (24 bancas + agregadores, com a pausa obrigatória entre
    # requisições ao mesmo host). O limite antigo era 15 min e mataria
    # o processo no meio, gravando nada. 90 dá folga para o dia em que
    # algum portal estiver lento.
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A varredura usa só a biblioteca padrão. O APROFUNDAMENTO precisa
      # de navegador (bancas que montam a lista por JavaScript) e de um
      # leitor de PDF — instalados só aqui, para a varredura continuar
      # rodando mesmo que este passo falhe.
      - name: Preparar o aprofundamento
        run: |
          python -m pip install --quiet pypdf playwright
          python -m playwright install --with-deps chromium

      - name: Varrer fontes
        run: python -u robo/atualizar.py --limite 30

      # Link do concurso, PDF do edital e salário DO CARGO.
      #
      # Separado da varredura porque é lento (abre navegador e baixa
      # PDF: ~1h nos 127 editais) e falha por motivos que não são
      # nossos — site fora do ar, certificado vencido. `|| true` para
      # que uma banca quebrada não derrube a publicação: sem ele, o
      # radar deixaria de atualizar por causa de um portal instável.
      #
      # Prioriza quem está sem link específico ou sem PDF; quem já tem
      # os dois não é revisitado toda semana.
      - name: Aprofundar (link, PDF e salário do cargo)
        timeout-minutes: 120
        run: python -u robo/aprofundar.py --pendentes || true

      # Rede de segurança ANTES de publicar. Se a varredura produzir
      # algo que viole as regras do produto, o job falha e o site fica
      # como está — melhor um dia desatualizado que um dia errado.
      - name: Conferir o que vai ao ar
        run: python -u robo/conferir.py

      - name: Publicar
        run: |
          if git diff --quiet -- data/; then
            echo "Nenhuma mudança — nada a publicar."
            exit 0
          fi

          git config user.name  "Radar Concursos Contabilidade"
          git config user.email "actions@github.com"
          git add data/
          git commit -m "chore(radar): varredura de $(date -u +%d/%m/%Y)"

          # A varredura leva ~50 min. Nesse tempo alguém pode publicar
          # no repositório, e o push é rejeitado ("fetch first"). Já
          # aconteceu duas vezes em execuções reais.
          #
          # O rebase simples NÃO resolve: data/editais.json é reescrito
          # inteiro dos dois lados, então dá conflito de conteúdo em
          # todas as linhas e o rebase trava pedindo resolução manual —
          # que ninguém vai fazer às 6 da manhã.
          #
          # `-X ours` durante o rebase mantém a versão DA VARREDURA nos
          # arquivos de dados. É o certo, não um atalho: a varredura
          # acabou de consultar as fontes, então o que ela traz é mais
          # recente que qualquer coisa no repositório. Uma edição manual
          # que precise sobreviver deve ser marcada com
          # `"revisado": true`, e aí o próprio robô a preserva.
          for tentativa in 1 2 3; do
            if git push; then
              echo "Publicado."
              exit 0
            fi
            echo "Push rejeitado (tentativa $tentativa) — sincronizando..."
            git pull --rebase -X ours origin main || {
              echo "Rebase falhou de forma não resolvível."
              git rebase --abort || true
              exit 1
            }
          done

          echo "Não foi possível publicar após 3 tentativas."
          exit 1
